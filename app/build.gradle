apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdkVersion 36
    // buildToolsVersion '31.0.0'
    defaultConfig {
        applicationId "net.eneiluj.moneybuster"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 40
        versionName "0.1.20"
        vectorDrawables.useSupportLibrary = true
        resValue "string", "applicationId", applicationId
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }
    kotlin {
        jvmToolchain(21)
    }
    flavorDimensions "default"
    productFlavors {
        normal {
            dimension "default"
            resValue "string", "app_name", "MoneyBuster2"
        }
        dev {
            dimension "default"
            applicationId 'net.eneiluj.moneybuster.dev'
            resValue "string", "applicationId", applicationId
            // applicationIdSuffix '.dev'
            resValue "string", "app_name", "MoneyBuster2 Dev"
        }
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }
    lint {
        abortOnError = false
        disable 'MissingTranslation'
    }
    namespace = 'net.eneiluj.moneybuster'
    androidResources {
        generateLocaleConfig = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Pinned, published revision compatible with this app's Kotlin/Android toolchain.
    implementation 'com.github.bitfireAT:cert4android:b67ba86d313ceb622d7717ad7b587abc74a2caa9'

// AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'com.google.android.material:material:1.11.0'

// Other
    implementation 'com.github.kizitonwose.colorpreference:support:1.0.6'
    implementation 'com.larswerkman:lobsterpicker:1.0.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.yuriy-budiyev:code-scanner:2.3.2'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'com.github.nextcloud:Android-SingleSignOn:1.1.0'
    implementation 'com.github.nextcloud.android-common:ui:0.33.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.opencsv:opencsv:5.1'
    implementation 'net.objecthunter:exp4j:0.4.8'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    androidTestImplementation 'junit:junit:4.13.2'
}

