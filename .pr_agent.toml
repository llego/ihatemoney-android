# PR-Agent configuration (self-hosted, GitHub Action).
# See https://docs.pr-agent.ai/usage-guide/configuration_reference
# Model is routed through OpenRouter; change the slug to any model you use.
# The API key lives in the repo secret OPENROUTER_KEY (passed as OPENROUTER__KEY).

[config]
model = "openrouter/deepseek/deepseek-v4-flash-latest"
fallback_models = ["openrouter/deepseek/deepseek-v4-flash-latest"]
custom_model_max_tokens = 16000

[github_action_config]
pr_actions = ['opened', 'reopened', 'ready_for_review', 'review_requested', 'synchronize']